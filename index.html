<!DOCTYPE html>
<html>
    <head>
        <title>Zad 3.2</title>
        <style>
            * {
                box-sizing: border-box;
            }

            body {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                align-items: start;
                gap: 1.5rem;
                margin: 0;
                padding: 2rem;
                color: #202a35;
                background: #f3f6f8;
                font-family: system-ui, sans-serif;
            }

            table {
                width: 100%;
                min-width: 0;
                table-layout: fixed;
                border-collapse: collapse;
                background: #fff;
                box-shadow: 0 2px 10px rgb(22 37 52 / 10%);
            }

            td {
                overflow-wrap: anywhere;
            }

            body > p {
                grid-column: 1 / -1;
                margin: 0;
            }

            th,
            td {
                padding: 0.85rem 1rem;
                border-bottom: 1px solid #dce3e8;
                text-align: left;
            }

            th {
                color: #fff;
                background: #245c63;
                font-size: 0.9rem;
                font-weight: 650;
            }

            tbody tr:nth-child(even) {
                background: #f1f6f5;
            }

            tbody tr:hover {
                background: #e3efed;
            }

            @media (max-width: 640px) {
                body {
                    grid-template-columns: minmax(0, 1fr);
                    padding: 1rem;
                }
            }
        </style>
    </head>
    <body>
        <table>
            <thead>
                <tr>
                    <th>Station Id</th>
                    <th>Name</th>
                    <th>Latitude</th>
                    <th>Longitude</th>
                </tr>
            </thead>
            <tbody id="station_body">

            </tbody>
        </table>

        <table>
            <thead>
                <tr>
                    <th>Id</th>
                    <th>Name</th>
                    <th>Maxdate</th>
                    <th>Mindate</th>
                </tr>
            </thead>
            <tbody id="dataset_body">

            </tbody>
        </table>

        <script src="src.js"></script>
    </body>
</html>
